<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football News Aggregator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="HEX WHITE.png" alt="Football News Logo" class="logo">

        <h1>Football News</h1>
    </header>
    <main>
        <section id="transfermarkt">
            <h2>Transfermarkt News</h2>
            <div class="news-container"><p class="loading">Loading news...</p></div>
        </section>

        <section id="uefa">
            <h2>UEFA News</h2>
            <div class="news-container"><p class="loading">Loading news...</p></div>
        </section>

        <section id="eyefootball">
            <h2>EyeFootball News</h2>
            <div class="news-container"><p class="loading">Loading news...</p></div>
        </section>

        <section id="bbc">
            <h2>BBC Sport News</h2>
            <div class="news-container"><p class="loading">Loading news...</p></div>
        </section>

        <section id="footballlondon">
            <h2>Football.London News</h2>
            <div class="news-container"><p class="loading">Loading news...</p></div>
        </section>

        <!-- Nouvelle section ESPN -->
        <section id="espn">
            <h2>ESPN News</h2>
            <div class="news-container"><p class="loading">Loading news...</p></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
